[package]
name = "ferrite-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "ferrite_core"
path = "src/lib.rs"

# Device-agnostic framework library, generic over `P: Platform`. Concrete device
# backends, entry points and panic handlers live in the `bsp/*` crates; this
# crate owns the HAL traits, the framework modules and the shared
# `runtime::run` loop.
[features]
default = []
# Host-only mock platform for type-checking the generic framework without an
# embedded toolchain. See src/mock.rs.
mock = []
# Selected by `bsp-sim`: build the lib with std (the host sim is a std binary).
host = []
# Selected by `bsp-exynos4412`: the BSP registers the HAL's allocator as
# `#[global_allocator]`, so the lib's static heap must not also claim that
# role. The BSP overrides `PlatformRuntime::heap_stats` to report through it.
external_alloc = []
# JPEG images (FI mode 3): `jpeg` module, `Platform::JpegB`, `Ctx::jpeg`.
# Without it a mode-3 image does not load.
jpeg = []

# Always compiled in XL (features in ferrite-ui): 32-bit object pointers and
# pool offsets, 32-bit code addresses, multi-program tasks, the fast VM,
# superinstructions, the render geometry cache, retained layers, the perf
# profiler and audio.

[dependencies]
libm = "0.2"
